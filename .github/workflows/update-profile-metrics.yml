name: Update profile metrics

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate verified public metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/render_metrics.py

      - name: Commit updated panel when data changed
        run: |
          if git diff --quiet -- assets/live-public-signal.svg assets/live-public-signal-light.svg; then
            echo "Metrics are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/live-public-signal.svg assets/live-public-signal-light.svg
          git commit -m "chore: refresh public profile metrics"
          git push
